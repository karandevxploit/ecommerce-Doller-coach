# ===============================
# REDIS PRODUCTION CONFIG
# For backend cache, rate limits, and BullMQ queues
# ===============================

# ===============================
# NETWORK & SECURITY
# ===============================
bind 127.0.0.1
protected-mode yes
port 6379
supervised systemd

# Use ACL in production. Replace STRONG_PASSWORD_HERE before deploying.
user default off
user appuser on >STRONG_PASSWORD_HERE ~* +@all -flushdb -flushall -keys -config -shutdown -debug

# ===============================
# CONNECTIONS
# ===============================
tcp-backlog 511
timeout 0
tcp-keepalive 60
maxclients 5000

# ===============================
# MEMORY MANAGEMENT
# ===============================
maxmemory 2gb

# BullMQ requires queue keys not to be evicted. Scale memory before Redis fills up.
maxmemory-policy noeviction

# ===============================
# PERSISTENCE
# ===============================
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 128mb

# Keep a light RDB snapshot for faster disaster recovery.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

# ===============================
# PERFORMANCE
# ===============================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ===============================
# SLOW LOG + LATENCY
# ===============================
slowlog-log-slower-than 5000
slowlog-max-len 256
latency-monitor-threshold 100

# ===============================
# CLIENT SAFETY
# ===============================
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ===============================
# LUA SAFETY
# ===============================
lua-time-limit 5000

# ===============================
# LOGGING
# ===============================
loglevel notice
logfile /var/log/redis/redis-server.log

# ===============================
# DATABASES
# ===============================
databases 16

# ===============================
# MEMORY OPTIMIZATION (Redis 7 names)
# ===============================
hash-max-listpack-entries 512
hash-max-listpack-value 64
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64

# Legacy aliases for Redis 6 compatibility. Comment these if Redis rejects them.
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# ===============================
# SECURITY HARDENING
# ===============================
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""

# ===============================
# DEFRAGMENTATION
# Enable only if Redis is built with jemalloc.
# ===============================
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

# ===============================
# HIGH AVAILABILITY NOTES
# ===============================
# Use managed Redis or Sentinel/replication for production HA.
# replicaof <master-ip> 6379
